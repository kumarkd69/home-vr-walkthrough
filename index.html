<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f12">
<title>Home VR Walkthrough</title>
<style>
  :root{ --bg:#0d0f12; --fg:#e9edf2; --accent:#5b8cff; --danger:#e05a5a; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font:15px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{display:block;touch-action:none}

  #start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:center;
    align-items:center;gap:14px;padding:28px;text-align:center;background:var(--bg)}
  #start h1{font-size:21px;margin:0}
  #start p{margin:0;opacity:.72;font-size:13px;max-width:440px}
  #loadWrap{width:min(320px,80vw);height:10px;border-radius:6px;background:#20242c;overflow:hidden;display:none}
  #loadBar{height:100%;width:0%;background:var(--accent);transition:width .15s}
  #loadPct{font-size:13px;opacity:.75}
  #startErr{color:var(--danger);font-size:13px;max-width:420px;display:none;white-space:pre-wrap}
  .bigbtn{display:inline-block;padding:16px 26px;background:var(--accent);border:none;border-radius:12px;
    font-weight:700;font-size:16px;color:#fff;min-width:220px}
  .bigbtn.secondary{background:#20242c;color:var(--fg)}
  #motionRow{display:flex;flex-direction:column;gap:10px;align-items:center}

  #hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;
    font-size:12px;background:rgba(0,0,0,.55);padding:6px 14px;border-radius:20px;opacity:.85;
    pointer-events:none;text-align:center}
  #hud.hide{display:none}

  #cal{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;
    text-align:center;background:rgba(0,0,0,.82);font-size:15px;line-height:1.6;padding:24px}

  #dbg{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;z-index:5;
    font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;
    background:rgba(0,0,0,.5);padding:4px 8px;border-radius:8px;opacity:.75;pointer-events:none;display:none}

  #ui{position:fixed;left:0;right:0;bottom:0;padding:10px max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom))
    max(10px,env(safe-area-inset-left));display:flex;gap:8px;flex-wrap:wrap;
    background:linear-gradient(transparent,rgba(0,0,0,.8));z-index:6}
  #ui.hide{display:none}
  button{flex:1 1 auto;min-width:84px;min-height:48px;padding:12px 8px;border:1px solid #2a2f38;border-radius:10px;
    background:#171b21cc;color:var(--fg);font-size:13px;font-weight:600}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  #exit{position:fixed;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));z-index:8;
    display:none;min-width:auto;padding:10px 16px;background:rgba(20,20,24,.8);border-radius:24px;font-size:13px}

  /* on-screen walk pad for the flat phone view */
  #pad{position:fixed;left:50%;transform:translateX(-50%);
    bottom:150px;z-index:6;
    display:flex;flex-direction:column;align-items:center;gap:8px}
  #pad.hide{display:none}
  #pad .padrow{display:flex;gap:8px}
  .padbtn{width:64px;height:64px;min-width:64px;min-height:64px;padding:0;border-radius:16px;
    font-size:22px;line-height:1;background:rgba(23,27,33,.82);border:1px solid #39404b;
    color:var(--fg);flex:0 0 auto;touch-action:none}
  .padbtn:active,.padbtn.down{background:var(--accent);border-color:var(--accent);color:#fff}

  #settings{position:fixed;right:8px;bottom:120px;z-index:7;width:min(260px,72vw);background:#12151af2;
    border:1px solid #2a2f38;border-radius:12px;padding:10px 12px;display:none;font-size:12px;
    max-height:calc(100vh - 190px);overflow-y:auto;-webkit-overflow-scrolling:touch}
  #settings.show{display:block}
  #settings label{display:flex;justify-content:space-between;gap:8px;margin:6px 0}
  #settings input[type=range]{flex:1}
  #settings h4{margin:2px 0 6px;font-size:12px;opacity:.7}
  #settings .mono{font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.8;
    white-space:pre-wrap;word-break:break-word;margin:3px 0}
</style>
</head>
<body>

<div id="start">
  <h1>Home VR Walkthrough</h1>
  <p>Loads <b>home.glb</b> automatically. For head-tracking on iPhone, Safari needs a one-time permission tap below, then use a cardboard-style headset in <b>Enter VR</b>.</p>
  <div id="motionRow">
    <button id="enableMotion" class="bigbtn">Enable head tracking</button>
    <button id="skipMotion" class="bigbtn secondary">Skip — use touch-drag look</button>
  </div>
  <div id="loadWrap"><div id="loadBar"></div></div>
  <p id="loadPct"></p>
  <p id="startErr"></p>
</div>

<div id="cal"></div>
<div id="hud" class="hide">Look <b>down</b> to walk · look level to stop</div>
<div id="dbg"></div>
<button id="exit">✕ Exit VR</button>

<div id="settings">
  <h4>Lens / comfort tuning</h4>
  <label>IPD (m) <input id="ipd" type="range" min="0.05" max="0.075" step="0.001"></label>
  <label>Distortion k1 <input id="k1" type="range" min="0" max="0.6" step="0.01"></label>
  <label>Distortion k2 <input id="k2" type="range" min="0" max="0.4" step="0.01"></label>
  <label>Walk speed (m/s) <input id="spd" type="range" min="0.4" max="3" step="0.1"></label>
  <label>Swap gaze walk direction <input id="gazeSwapInput" type="checkbox"></label>
  <label>Invert look up/down <input id="invPitch" type="checkbox"></label>
  <label>Invert turning <input id="invYaw" type="checkbox"></label>
  <label>Legacy head tracking <input id="legacyTrack" type="checkbox"></label>
  <label>Show diagnostics <input id="diagToggle" type="checkbox"></label>

  <h4 style="margin-top:12px">Remote / controller</h4>
  <div id="padStatus" class="mono">No controller detected</div>
  <div id="keyLog" class="mono">last key: —</div>
  <button id="bindBtn" style="width:100%;min-height:40px;margin:6px 0">Learn buttons</button>
  <div id="bindStatus" class="mono"></div>
</div>

<!-- On-screen walk controls for the plain phone view (no headset needed) -->
<div id="pad" class="hide">
  <button class="padbtn" id="padF" data-act="fwd">▲</button>
  <div class="padrow">
    <button class="padbtn" id="padL" data-act="left">◀</button>
    <button class="padbtn" id="padB" data-act="back">▼</button>
    <button class="padbtn" id="padR" data-act="right">▶</button>
  </div>
</div>

<div id="ui" class="hide">
  <button id="vr">🥽 Enter VR</button>
  <button id="walk" class="on">Gaze-walk</button>
  <button id="floor">Floor: G</button>
  <button id="recenter">Recentre</button>
  <button id="tune">Tune</button>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.169.0/three.module.min.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

/* =========================================================================
   TUNABLES — edit these to match your headset / preference.
   ========================================================================= */
const GLB_URL       = 'home.glb';
const EYE_HEIGHT    = 1.6;                 // eye height in metres, fixed per floor
// Floor slab heights (metres, Y-up, baked by convert.js). Detected from the
// "floor" tile geometry's Y clusters by convert.js — see its console output.
// convert.js found clusters at 0.25 / 3.56 / 6.88 m; the first two are used
// as Ground and Floor 1. Edit this array if your model differs.
const FLOOR_HEIGHTS = [0.0, 3.56];
const WALK_SPEED_DEFAULT   = 1.4;          // m/s
const GAZE_FWD_THRESH_DEG  = 18;           // look down past this many degrees to walk forward
                                           // (looking up never walks you backwards — by design)
const PLAYER_RADIUS  = 0.32;               // collision capsule radius, metres
const IPD_DEFAULT     = 0.064;             // metres, cardboard default
const DISTORT_K1_DEFAULT = 0.22;           // barrel distortion coefficients — tune per headset
const DISTORT_K2_DEFAULT = 0.08;

/* =========================================================================
   Renderer / scene
   ========================================================================= */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));           // cap pixel ratio for perf
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// simple vertical-gradient sky so an untextured grey model still reads against something
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 128;
  const ctx = c.getContext('2d');
  const g = ctx.createLinearGradient(0,0,0,128);
  g.addColorStop(0,'#7fb1e0'); g.addColorStop(1,'#dce8f2');
  ctx.fillStyle = g; ctx.fillRect(0,0,2,128);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  scene.background = tex;
}
scene.add(new THREE.HemisphereLight(0xdfe9f5, 0x545a55, 2.4));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.7);
sun.position.set(8, 20, 10);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 0.35)); // cheap fill to fake soft AO readability

/* =========================================================================
   Rig: rig(position) -> head(orientation) -> camL / camR / camMono
   ========================================================================= */
const rig  = new THREE.Object3D(); scene.add(rig);
const head = new THREE.Object3D(); rig.add(head);
const camL = new THREE.PerspectiveCamera(70, 1, 0.05, 300);
const camR = camL.clone();
const camMono = camL.clone();
head.add(camL, camR, camMono);

let IPD = IPD_DEFAULT;
function applyIPD(){ camL.position.x = -IPD/2; camR.position.x = IPD/2; }
applyIPD();

/* =========================================================================
   Load home.glb — auto, with progress + error UI
   ========================================================================= */
const loadBar = document.getElementById('loadBar');
const loadWrap = document.getElementById('loadWrap');
const loadPct = document.getElementById('loadPct');
const startErr = document.getElementById('startErr');
const startEl = document.getElementById('start');

let collidables = [];       // meshes used for wall collision (everything except glazing? no — everything except doors)
let houseBox = new THREE.Box3();
let modelLoaded = false;

loadWrap.style.display = 'block';
const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/libs/draco/');
const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);
gltfLoader.load(
  GLB_URL,
  gltf => {
    scene.add(gltf.scene);
    gltf.scene.traverse(o=>{
      if(o.isMesh){
        o.matrixAutoUpdate = false; o.updateMatrix();
        if(o.name !== 'door') collidables.push(o);   // door leaves excluded so doorways are walkable
      }
    });
    houseBox.setFromObject(gltf.scene);
    const c = new THREE.Vector3(); houseBox.getCenter(c);
    rig.position.set(c.x, FLOOR_HEIGHTS[0] + EYE_HEIGHT, c.z);
    useCollisionFloor(FLOOR_HEIGHTS[0]);
    modelLoaded = true;
    loadPct.textContent = 'Loaded ✓';
    setTimeout(()=>{ loadWrap.style.display='none'; loadPct.textContent=''; }, 400);
    readyGate();
  },
  xhr => {
    if(xhr.lengthComputable){
      const pct = Math.round(xhr.loaded/xhr.total*100);
      loadBar.style.width = pct + '%';
      loadPct.textContent = 'Loading model… ' + pct + '%';
    } else {
      loadPct.textContent = 'Loading model… ' + Math.round(xhr.loaded/1024/1024*10)/10 + ' MB';
    }
  },
  err => {
    startErr.style.display = 'block';
    startErr.textContent = 'Could not load ' + GLB_URL + '.\n' +
      'Make sure home.glb is in the same folder as this page and that you are loading it over http(s), not file://.\n' +
      (err && err.message ? err.message : '');
    loadPct.textContent = '';
  }
);

/* =========================================================================
   HEAD TRACKING
   =========================================================================

   Why this is not the usual three.js DeviceOrientationControls snippet:

   `deviceorientation` reports alpha/beta/gamma — a Z-X'-Y'' Euler
   decomposition. Every cardboard demo composes those three angles back into
   a rotation. That works fine for a phone held flat-ish, and breaks badly
   for a phone lying in a VR headset, because:

     A phone in a headset, in landscape, looking at the horizon sits at
     beta = 0, gamma = ±90.

   gamma's range is clamped to [-90, 90]. So the resting pose of a headset is
   exactly ON gamma's boundary, which is also the gimbal-lock configuration
   of that Euler sequence. Pitch your head up from there and gamma cannot
   keep going — instead the OS jumps beta by 180° and reflects gamma. The
   composed rotation whips around, which is precisely the reported
   "when I look up it switches to the back angle / I can't look up" bug.
   No amount of smoothing or glitch-rejection fixes that: the representation
   itself is degenerate there, not the data.

   So instead:
     * Pitch and roll come from the GRAVITY DIRECTION, computed from beta and
       gamma only (formula below). Gravity is a physical direction, not a
       decomposition artifact, so it stays continuous straight through the
       degenerate pose.
     * Rotation is carried by integrating the GYROSCOPE
       (devicemotion.rotationRate) into a quaternion. Integrating angular
       velocity never decomposes into Euler angles, so it has no singularity
       anywhere — you can look straight up, straight down, roll over, fine.
     * Gravity continuously pulls the integrated orientation back to true
       vertical (complementary filter), killing gyro drift in pitch/roll.
     * Yaw drift is handled by the Recentre button. alpha/compass is not used
       at all, which also means indoor magnetic interference can't upset it.
   ========================================================================= */

let gyroOn = false;          // receiving orientation data of some kind
let gyroAvailable = false;   // devicemotion rotationRate is actually arriving
let motionDenied = false;
let legacyTracking = false;  // escape hatch: use the old Euler method
let invertPitch = false;     // escape hatch for a mirrored pitch axis
let invertYaw = false;       // escape hatch for a mirrored turn axis
let gazeSwap = false;        // swap which way gaze-walk drives you

// device frame: X = right of screen, Y = top of screen, Z = out of the screen
// sensor world frame: X = east, Y = north, Z = up
const qDS = new THREE.Quaternion();      // device -> sensor world (the fused estimate)
let qDSInit = false;
// sensor world -> three.js world (X east, Y up, Z south) is -90° about X
const qSensorToWorld = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2);
const qYawOffset = new THREE.Quaternion();   // set by Recentre
const legacyQ = new THREE.Quaternion();      // result of the old Euler path
const headQ = new THREE.Quaternion();        // final composed orientation

const gravDev = new THREE.Vector3(0, 0, -1); // measured "down", in device coords
let gravValid = false;
let legacyValid = false;

const _euler = new THREE.Euler();
const _zAxis = new THREE.Vector3(0, 0, 1);
const _yAxis = new THREE.Vector3(0, 1, 0);
const _omega = new THREE.Vector3();
const _up    = new THREE.Vector3();
const _gPred = new THREE.Vector3();
const _dq    = new THREE.Quaternion();
const _qa    = new THREE.Quaternion();
const _qb    = new THREE.Quaternion();
const _qLegacyBack = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2);

// screen.orientation.angle can legitimately be 0 (portrait), so don't use `||`
// chains that treat 0 as "missing" — that silently fell back to the legacy,
// oppositely-signed window.orientation.
function readScreenAngle(){
  if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
  if (typeof window.orientation === 'number') return window.orientation;
  return 0;
}
let screenAngle = readScreenAngle();
addEventListener('orientationchange', ()=>{ screenAngle = readScreenAngle(); });

let lastHeadingDeg = 0, lastBetaDeg = 0, lastGammaDeg = 0;

/* --- gravity + legacy path, from `deviceorientation` --------------------- */
function handleOrientation(e){
  if(e.beta == null && e.gamma == null && e.alpha == null) return;
  gyroOn = true;

  const betaDeg  = e.beta  || 0;
  const gammaDeg = e.gamma || 0;
  lastBetaDeg = betaDeg; lastGammaDeg = gammaDeg;
  const b = THREE.MathUtils.degToRad(betaDeg);
  const g = THREE.MathUtils.degToRad(gammaDeg);

  // World "down" expressed in device coordinates, derived from the spec's
  // R = Rz(alpha)·Rx(beta)·Ry(gamma):  g_device = Rᵀ·(0,0,-1).
  // Note it does not involve alpha at all — rotation about the vertical axis
  // cannot change which way is down — which is exactly why this stays well
  // behaved where the full alpha/beta/gamma composition falls apart.
  gravDev.set(
     Math.sin(g) * Math.cos(b),
    -Math.sin(b),
    -Math.cos(g) * Math.cos(b)
  ).normalize();
  gravValid = true;

  // Use ALPHA, not webkitCompassHeading.
  //
  // This was the cause of the view swinging round to face backwards when you
  // looked up. webkitCompassHeading is Apple's compass bearing of the device's
  // top edge — it is NOT alpha, and `alpha = 360 - heading` only holds while
  // the phone is roughly flat or upright. In a headset, looking up swings that
  // top edge towards vertical, where its bearing is undefined, so the value
  // swings a full 180 degrees as you cross the horizon. Substituting it into
  // the alpha slot of Rz(alpha)Rx(beta)Ry(gamma) then rotates the whole world.
  // Reproduced: yaw went 0 -> 71 -> 144 degrees the moment pitch went positive.
  //
  // alpha is the quantity this composition actually wants, and iOS reports it
  // alongside the compass heading. We never needed true north anyway —
  // Recentre defines which way "forward" is.
  if (e.alpha != null) lastHeadingDeg = e.alpha;
  else if (typeof e.webkitCompassHeading === 'number') lastHeadingDeg = 360 - e.webkitCompassHeading;

  // Composition of the raw alpha/beta/gamma. Used as a selectable fallback for
  // the whole orientation, and — more importantly — as the only available
  // source of YAW when there is no gyroscope. The individual angles jump
  // around near the headset's resting pose, but their composition does not.
  if (e.alpha != null || typeof e.webkitCompassHeading === 'number') {
    const a = THREE.MathUtils.degToRad(lastHeadingDeg);
    _euler.set(b, a, -g, 'YXZ');
    legacyQ.setFromEuler(_euler);
    legacyQ.multiply(_qLegacyBack);
    legacyQ.multiply(_qa.setFromAxisAngle(_zAxis, effectiveMount()));
    legacyValid = true;
  }

  if (!qDSInit) { seedFromGravity(); qDSInit = true; }
  else if (!gyroAvailable) {
    // No gyroscope. Gravity alone fully determines pitch and roll, and it is
    // already smoothed by iOS, so snap straight to it rather than easing —
    // easing here is what made head movement feel laggy and "not real time".
    correctWithGravity(1);
  }
}

function seedFromGravity(){
  qDS.identity();
  _gPred.set(0, 0, -1);
  qDS.multiply(_qa.setFromUnitVectors(gravDev, _gPred));
}

// Rotate the integrated estimate a little way toward agreeing with measured
// gravity. setFromUnitVectors gives the *minimal* rotation between the two, so
// it has no component about the vertical axis — i.e. it corrects pitch and
// roll without ever disturbing yaw.
function correctWithGravity(strength){
  if(!gravValid || !qDSInit) return;
  _gPred.set(0, 0, -1).applyQuaternion(_qa.copy(qDS).invert());
  _qb.setFromUnitVectors(gravDev, _gPred);
  if(strength >= 1) qDS.multiply(_qb);
  else qDS.multiply(_qa.identity().slerp(_qb, strength));
}

/* --- gyro integration, from `devicemotion` ------------------------------- */
let lastMotionT = 0;
function handleMotion(e){
  const rr = e.rotationRate;
  if(!rr || (rr.alpha == null && rr.beta == null && rr.gamma == null)) return;

  const now = performance.now();
  const dt = lastMotionT ? (now - lastMotionT) / 1000 : 0;
  lastMotionT = now;
  if(dt <= 0 || dt > 0.25) return;      // first sample, or the tab was backgrounded

  gyroAvailable = true; gyroOn = true;
  if(!qDSInit) return;                  // wait for a gravity sample to seed from

  // rotationRate is deg/s about the device's own axes:
  // beta -> X, gamma -> Y, alpha -> Z.
  _omega.set(
    THREE.MathUtils.degToRad(rr.beta  || 0),
    THREE.MathUtils.degToRad(rr.gamma || 0),
    THREE.MathUtils.degToRad(rr.alpha || 0)
  );

  if(invertYaw && gravValid){
    // Negate only the component of the rotation about the world vertical,
    // which is the physically correct way to mirror "turning" without
    // touching pitch or roll.
    _up.copy(gravDev).multiplyScalar(-1);
    _omega.addScaledVector(_up, -2 * _up.dot(_omega));
  }

  const mag = _omega.length();
  if(mag > 1e-8){
    _dq.setFromAxisAngle(_omega.divideScalar(mag), mag * dt);
    qDS.multiply(_dq);                  // right-multiply: increment is in body frame
  }
  correctWithGravity(0.02);             // slow pull back to true vertical
}

function attachSensorListeners(){
  addEventListener('deviceorientation', handleOrientation, true);
  addEventListener('deviceorientationabsolute', handleOrientation, true);
  addEventListener('devicemotion', handleMotion, true);
}

async function requestMotionPermission(){
  const needsMot = typeof DeviceMotionEvent !== 'undefined' &&
                   typeof DeviceMotionEvent.requestPermission === 'function';
  const needsOri = typeof DeviceOrientationEvent !== 'undefined' &&
                   typeof DeviceOrientationEvent.requestPermission === 'function';

  if(!needsOri && !needsMot){          // non-iOS: permission is implicit
    attachSensorListeners();
    return true;
  }

  // Ask for MOTION first and on its own. On iOS both events are governed by the
  // single "Motion & Orientation Access" setting, so one grant covers both —
  // but DeviceMotionEvent is the one that gates the *gyroscope*, and the
  // gyroscope is what yaw (looking left and right) depends on. Firing both
  // requests at once can get the second one rejected while a prompt is already
  // up, which silently leaves you with orientation but no gyro: pitch works,
  // turning your head does nothing, and everything feels laggy.
  let granted = false;
  try {
    if(needsMot) granted = (await DeviceMotionEvent.requestPermission()) === 'granted';
  } catch(_) { granted = false; }

  if(!granted && needsOri){
    try { granted = (await DeviceOrientationEvent.requestPermission()) === 'granted'; } catch(_) {}
  }

  // Attach either way: if access really was refused no events ever fire, and
  // if the user grants it later (Settings > Safari > Motion & Orientation)
  // tracking starts working without needing a reload.
  attachSensorListeners();
  if(!granted){ motionDenied = true; return false; }
  return true;
}

/* =========================================================================
   MOUNT ANGLE — how the phone is rotated inside the headset
   =========================================================================
   Everything above gives the phone's orientation in the world. To render it
   we also need to know which way is "up" for the person wearing it, i.e. how
   far the phone is rotated about the viewing axis inside the headset.

   The obvious source, screen.orientation.angle, is NOT trustworthy for this:
   iOS Safari cannot lock orientation from a web page, and if the user has
   Portrait Orientation Lock switched on (very common) Safari keeps reporting
   angle = 0 while the phone is physically sideways in the headset. Trusting
   it then rotates the whole world by 90°, which turns head pitch into view
   roll — "it tilts weirdly when I turn".

   So measure it physically instead. While you are looking straight ahead the
   viewing axis is horizontal, so gravity lies in the plane of the screen —
   and its direction in that plane IS the mount rotation. That is a physical
   measurement; no OS reporting quirk can spoil it.
   ========================================================================= */
let mountAngle = null;   // radians; null until calibrated, then measured

function effectiveMount(){
  // before calibration, fall back to the OS value
  return mountAngle !== null ? mountAngle : -THREE.MathUtils.degToRad(screenAngle);
}

function calibrateMount(){
  if(!gravValid) return false;
  const gx = gravDev.x, gy = gravDev.y;
  // if the phone is lying flat, gravity is along the viewing axis and tells us
  // nothing about rotation in the screen plane — refuse rather than guess
  if(Math.hypot(gx, gy) < 0.25) return false;
  mountAngle = Math.atan2(gx, -gy);
  return true;
}

const HALF_PI = Math.PI / 2;
function wrapPi(a){ return Math.atan2(Math.sin(a), Math.cos(a)); }

/* -------------------------------------------------------------------------
   How far the canvas itself must be rotated to match the user's eyes. Zero
   when Safari rotated the layout to match the phone; ±90° when rotation lock
   kept the layout portrait while the phone lies sideways in the headset.

   This must NOT be recomputed live. Tilting a phone towards flat — exactly
   what looking down or up in a headset does — makes iOS re-evaluate device
   orientation and fire `orientationchange`, so screen.orientation.angle flips
   by 90 or 180 degrees mid-session. Following that instantly snaps the whole
   view round, which is the abrupt flip to a "back view" when you look down or
   turn your head. The phone cannot actually move inside the headset, so a
   change here is almost always a spurious re-evaluation: require it to hold
   steady before believing it.
   ------------------------------------------------------------------------- */
let appliedCanvasRot = 0;
let pendingRot = null, pendingRotSince = 0;
const ROT_SETTLE_MS = 600;

function desiredCanvasRotation(){
  if(mountAngle === null) return 0;
  const r = wrapPi(mountAngle + THREE.MathUtils.degToRad(readScreenAngle()));
  return Math.round(r / HALF_PI) * HALF_PI;     // snap to a right angle
}

// Called every frame: adopt a new rotation only once it has been stable.
function settleCanvasRotation(){
  const want = desiredCanvasRotation();
  if(want === appliedCanvasRot){ pendingRot = null; return; }
  const now = performance.now();
  if(pendingRot !== want){ pendingRot = want; pendingRotSince = now; return; }
  if(now - pendingRotSince < ROT_SETTLE_MS) return;
  pendingRot = null;
  appliedCanvasRot = want;
  applyCanvasRotation();
}

/* -------------------------------------------------------------------------
   De-glitched yaw.

   Crossing the horizon is where alpha/beta/gamma switch representation — all
   three jump by roughly 180 degrees at once, e.g.

       head  0 deg  ->  alpha  90.0  beta    0.0  gamma -90.0
       head +5 deg  ->  alpha -90.0  beta -180.0  gamma +85.0

   Composed together those jumps cancel exactly... but only if all three
   arrive in the same sample. Alpha comes from the slower, heavily filtered
   magnetometer pipeline, so for a frame or two it does not, and the composed
   heading swings wildly — the view snapping round to face backwards just as
   you look up.

   A yaw step that big between two samples is physically impossible (it would
   be thousands of degrees per second), so treat it as what it is — a
   representation artefact — and hold the last good heading until the values
   settle, rather than following it round.
   ------------------------------------------------------------------------- */
/* -------------------------------------------------------------------------
   Which way a head is facing, measured from direction vectors rather than an
   Euler decomposition.

   Pulling heading out of a YXZ Euler decomposition is singular at pitch = ±90:
   yaw and roll collapse into the same degree of freedom, so as you look
   steeply up the extracted heading amplifies noise without limit. Measured,
   with 0.5 degrees of sensor noise:

       pitch      Euler heading spread     this function
        60 deg            1.7 deg             1.7 deg
        80 deg            5.7 deg             1.0 deg
        88 deg           28.1 deg             1.0 deg
       89.8 deg         248.2 deg             1.0 deg

   That is the flicker when looking up — and at 28 degrees it slips under the
   per-frame sanity guard, so it shows through as jitter. Fix: use the forward
   vector while it has a usable horizontal component, and switch to the head's
   up vector once forward goes near-vertical, where up is horizontal and well
   conditioned. Stable at every pitch, including straight up.
   ------------------------------------------------------------------------- */
const _fv = new THREE.Vector3(), _uv = new THREE.Vector3();
function headingOf(q){
  _fv.set(0, 0, -1).applyQuaternion(q);
  let x = _fv.x, z = _fv.z;
  if(Math.abs(_fv.y) > 0.9){                 // looking near-straight up or down
    _uv.set(0, 1, 0).applyQuaternion(q);
    const s = _fv.y > 0 ? -1 : 1;
    x = s * _uv.x; z = s * _uv.z;
  }
  return Math.atan2(-x, -z);                 // 0 = facing -Z
}

// A head turns at a few hundred degrees a second at most. Anything faster than
// this is the heading source misbehaving, not you moving — and crucially this
// catches a swing smeared across several samples, which a fixed per-sample
// threshold lets straight through (a filtered magnetometer flip arrives as
// ~36°/sample for five samples, not as one 180° jump).
const MAX_YAW_RATE = THREE.MathUtils.degToRad(400);   // per second
const MIN_YAW_STEP = THREE.MathUtils.degToRad(15);    // floor, for slow sample rates
let yawPrevRaw = null, yawFix = 0;

function stableLegacyYaw(dt){
  const want = (invertYaw ? -1 : 1) * headingOf(legacyQ);
  if(yawPrevRaw === null){ yawPrevRaw = want; return wrapPi(want + yawFix); }

  const delta = wrapPi(want - yawPrevRaw);
  yawPrevRaw = want;
  const limit = Math.max(MAX_YAW_RATE * (dt || 0.016), MIN_YAW_STEP);
  if(Math.abs(delta) > limit){
    // Absorb the jump into a permanent offset rather than holding and then
    // releasing it — holding only delays the snap, it doesn't remove it.
    // Taking it into the offset means the output never moves at all, and
    // when alpha catches up and jumps back, that is absorbed too.
    yawFix = wrapPi(yawFix - delta);
  }
  return wrapPi(want + yawFix);
}

/* --- compose the final head orientation ---------------------------------
   Pass dt to ease into the new orientation; omit it to snap immediately. */
const MAX_FRAME_JUMP = THREE.MathUtils.degToRad(70);
const MAX_REJECT_RUN = 20;           // ~330ms, then accept: never freeze the view
let glitchesRejected = 0, rejectRun = 0;
const SMOOTH_RATE = 42;              // 1/s — time constant ~24ms: enough to hide
                                     // frame-to-frame stepping, short enough that
                                     // it does not read as tracking lag
let headInit = false;

function updateHeadOrientation(dt){
  if(!gyroOn){
    head.quaternion.setFromEuler(_euler.set(pitch, yaw, 0, 'YXZ'));
    return;
  }
  if(!legacyTracking && qDSInit){
    // camera axes == device axes (you look out the back of the phone), so:
    //   head = (sensor world -> three world) · (device -> sensor world) · (mount)
    headQ.copy(qSensorToWorld)
         .multiply(qDS)
         .multiply(_qa.setFromAxisAngle(_zAxis, effectiveMount()));

    // Gravity gives pitch and roll but says nothing about which way you are
    // facing — rotating about the vertical axis doesn't move gravity at all.
    // So with no gyroscope yaw would never change and you simply could not
    // look left or right. Borrow yaw from the alpha/beta/gamma composition,
    // de-glitched as above.
    if(!gyroAvailable && legacyValid){
      const have = headingOf(headQ);
      const want = stableLegacyYaw(dt);
      headQ.premultiply(_qb.setFromAxisAngle(_yAxis, wrapPi(want - have)));
    }
  } else {
    headQ.copy(legacyQ);
  }
  headQ.premultiply(qYawOffset);

  if(invertPitch){
    _euler.setFromQuaternion(headQ, 'YXZ');
    _euler.x = -_euler.x;
    headQ.setFromEuler(_euler);
  }

  // Catch-all guard. Whatever the source — a sensor glitch, an encoding
  // switch, an axis flip — the head simply cannot rotate this far between two
  // frames (70° in one frame is >4000°/s). If it claims to, that is bad data,
  // not head movement, so ignore the frame rather than snapping the view.
  if(headInit && dt !== undefined){
    const jump = head.quaternion.angleTo(headQ);
    if(jump > MAX_FRAME_JUMP && rejectRun < MAX_REJECT_RUN){
      // Looks like bad data — skip this frame. But never reject forever: if
      // the new orientation persists it is real, so after a few hundred ms
      // stop rejecting and let the easing below carry us there smoothly
      // rather than leaving the view frozen.
      rejectRun++; glitchesRejected++;
      return;
    }
    if(jump <= MAX_FRAME_JUMP) rejectRun = 0;
  }

  // Ease rather than step. Short enough (~24ms) that it does not read as lag,
  // long enough that nothing in the view ever jumps a frame at a time.
  if(dt === undefined || !headInit){
    head.quaternion.copy(headQ);
    headInit = true;
  } else {
    head.quaternion.slerp(headQ, 1 - Math.exp(-dt * SMOOTH_RATE));
  }
}

// Recentre: make wherever you're looking right now the new "forward", and
// re-measure how the phone is sitting in the headset.
function recentreView(){
  const remeasured = calibrateMount();
  if(remeasured){
    appliedCanvasRot = desiredCanvasRotation();   // deliberate: adopt at once
    pendingRot = null;
    applyCanvasRotation();
  }
  headInit = false;                     // a recentre is deliberate: let it snap
  updateHeadOrientation();
  qYawOffset.premultiply(_qa.setFromAxisAngle(_yAxis, -headingOf(head.quaternion)));
  yaw = 0;
  return remeasured;
}

/* touch-drag look fallback (used when gyro denied, or on desktop) */
let drag=null, yaw=0, pitch=0;
renderer.domElement.addEventListener('pointerdown', e=>{ drag={x:e.clientX,y:e.clientY}; });
addEventListener('pointerup', ()=>drag=null);
addEventListener('pointermove', e=>{
  if(!drag || gyroOn) return;
  yaw   -= (e.clientX-drag.x)*0.006;
  pitch -= (e.clientY-drag.y)*0.006;
  pitch = THREE.MathUtils.clamp(pitch, -1.3, 1.3);
  drag = {x:e.clientX, y:e.clientY};
});

/* =========================================================================
   Remote / controller button bindings
   =========================================================================
   Rather than guessing what a given Bluetooth remote sends, you press
   "Learn buttons" and then press your own buttons for forward / back /
   left / right. Whatever arrives — a keyboard code from a HID-keyboard-mode
   remote, or a Gamepad button index — gets bound and saved.
   ========================================================================= */
const BIND_STEPS = [
  ['forward', 'FORWARD'],
  ['back',    'BACK'],
  ['left',    'LEFT (sidestep)'],
  ['right',   'RIGHT (sidestep)'],
];
let bindings = {};      // { forward:{t:'k',c:'KeyW'} | {t:'p',i:0}, ... }
let learnIdx = -1;      // -1 = not learning, else index into BIND_STEPS

function bindingLabel(b){
  if(!b) return 'unset';
  if(b.t === 'k') return b.c;
  if(b.t === 'm') return 'mouse button ' + b.b;
  return 'pad button ' + b.i;
}
function describeBindings(){
  if(!Object.keys(bindings).length) return 'Nothing bound yet — gaze, WASD and a standard stick still work.';
  return BIND_STEPS.map(([k, label]) => `${label}: ${bindingLabel(bindings[k])}`).join('\n');
}
function showLearnPrompt(){
  const el = document.getElementById('bindStatus');
  if(!el) return;
  el.textContent = learnIdx < 0
    ? describeBindings()
    : `Press your button for ${BIND_STEPS[learnIdx][1]}   (${learnIdx+1} of ${BIND_STEPS.length})`;
}
function captureBinding(b){
  if(learnIdx < 0) return;
  bindings[BIND_STEPS[learnIdx][0]] = b;
  learnIdx++;
  if(learnIdx >= BIND_STEPS.length){
    learnIdx = -1;
    saveSettings({ bindings });
  }
  showLearnPrompt();
}

/* =========================================================================
   Keyboard + remote key capture
   Bluetooth "VR remotes" that present as a HID keyboard deliver real keydown
   events here, so they drive movement through exactly the same path as WASD.
   lastKeyLabel is surfaced in the Tune panel so you can see what (if
   anything) a given button actually sends.
   ========================================================================= */
const keys = {};
let lastKeyLabel = '—';
function keyIdOf(e){ return e.code || ('kc' + e.keyCode); }
addEventListener('keydown', e=>{
  const id = keyIdOf(e);
  keys[id] = 1;
  lastKeyLabel = `${id}  (key "${e.key}", keyCode ${e.keyCode})`;
  if(learnIdx >= 0){ captureBinding({ t:'k', c:id }); e.preventDefault(); }
});
addEventListener('keyup', e=>{ keys[keyIdOf(e)] = 0; });

/* Many of these VR remotes have a "mouse" mode, where the stick moves a
   pointer and the buttons are real mouse clicks. Safari delivers those, so
   that mode is usable even when the media-key mode is not. Bindable too. */
const mouseHeld = {};
addEventListener('pointerdown', e=>{
  if(e.pointerType !== 'mouse') return;      // don't let a screen tap bind itself
  mouseHeld[e.button] = 1;
  lastKeyLabel = `mouse button ${e.button}`;
  if(learnIdx >= 0){ captureBinding({ t:'m', b:e.button }); e.preventDefault(); }
});
addEventListener('pointerup', e=>{ if(e.pointerType === 'mouse') mouseHeld[e.button] = 0; });
addEventListener('contextmenu', e=>{ if(learnIdx >= 0 || bindings.left || bindings.right) e.preventDefault(); });

/* =========================================================================
   Start-screen flow: motion permission must come from a real tap (iOS rule)
   ========================================================================= */
let motionAsked = false;
// The start screen must NOT dismiss itself just because the model finished
// loading — iOS only grants motion access from inside a real tap handler, so
// the user has to actually press one of those two buttons first.
function readyGate(){
  if(modelLoaded && motionAsked) enterUI();
}
function enterUI(){
  startEl.style.display = 'none';
  document.getElementById('ui').classList.remove('hide');
  document.getElementById('pad').classList.remove('hide');
  layoutPad();
}
document.getElementById('enableMotion').onclick = async ()=>{
  motionAsked = true;
  const ok = await requestMotionPermission();
  if(!ok){ startErr.style.display='block'; startErr.textContent='Motion access denied — falling back to touch-drag look. You can re-enable it from Settings > Safari > Motion & Orientation Access, then reload.'; }
  readyGate();
};
document.getElementById('skipMotion').onclick = ()=>{ motionAsked = true; readyGate(); };

/* =========================================================================
   Barrel-distortion stereo pipeline (render each eye to a target, then a
   fullscreen shader pass pre-distorts it to cancel the cardboard lens's
   pincushion distortion).
   ========================================================================= */
const distortUniforms = {
  tex:   { value: null },
  k1:    { value: DISTORT_K1_DEFAULT },
  k2:    { value: DISTORT_K2_DEFAULT },
};
const distortMat = new THREE.ShaderMaterial({
  uniforms: distortUniforms,
  vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: `
    precision highp float;
    uniform sampler2D tex;
    uniform float k1, k2;
    varying vec2 vUv;
    void main(){
      vec2 c = vUv * 2.0 - 1.0;
      float r2 = dot(c, c);
      vec2 cd = c * (1.0 + k1*r2 + k2*r2*r2);
      vec2 uv = cd * 0.5 + 0.5;
      if(uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0){
        gl_FragColor = vec4(0.0,0.0,0.0,1.0);
        return;
      }
      gl_FragColor = texture2D(tex, uv);
    }
  `,
  depthTest:false, depthWrite:false
});
const distortQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), distortMat);
const distortScene = new THREE.Scene(); distortScene.add(distortQuad);
const distortCam = new THREE.Camera();

let rtL = null, rtR = null;
function makeRT(w,h){
  return new THREE.WebGLRenderTarget(w, h, { colorSpace: THREE.SRGBColorSpace, samples: 2 });
}
function rebuildRenderTargets(){
  const w = Math.floor(viewW * Math.min(devicePixelRatio,2) / 2);
  const h = Math.floor(viewH * Math.min(devicePixelRatio,2));
  if(rtL) rtL.dispose(); if(rtR) rtR.dispose();
  rtL = makeRT(w,h); rtR = makeRT(w,h);
}

/* =========================================================================
   UI wiring
   ========================================================================= */
let stereo = false, autoWalk = true, floorIdx = 0;
let viewW = innerWidth, viewH = innerHeight;
const $ = id => document.getElementById(id);

async function enterVR(){
  if(!motionAsked){ await requestMotionPermission(); motionAsked = true; }
  try{ await document.documentElement.requestFullscreen(); }catch(_){}
  // Note: iOS Safari does not support orientation lock from a web page, so
  // this silently does nothing there. That is exactly why the mount angle is
  // measured from gravity instead of trusted from screen.orientation.
  try{ if(screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(_){}
  stereo = true;
  $('ui').classList.add('hide'); $('settings').classList.remove('show');
  $('pad').classList.add('hide');
  $('exit').style.display='block';
  applyCanvasRotation();
  rebuildRenderTargets();
  runCalibration();
}

/* Calibration countdown: you cannot tap the screen once the phone is inside
   the headset, so give it a few seconds to be mounted, then measure. */
let calTimer = null;
function runCalibration(seconds = 6){
  const el = $('cal');
  clearInterval(calTimer);
  $('hud').classList.add('hide');
  el.style.display = 'flex';
  let left = seconds;
  const tick = ()=>{
    el.innerHTML = `<div><b>Put the phone in the headset</b><br>` +
      `Hold your head level, looking straight ahead.<br>` +
      `<span style="font-size:34px">${left}</span></div>`;
    if(left <= 0){
      clearInterval(calTimer);
      const ok = recentreView();
      // If the canvas had to be rotated, iOS kept the page portrait while the
      // phone is sideways — i.e. Portrait Orientation Lock is on. The 3D view
      // is corrected, but the buttons/text overlays cannot rotate with it.
      const locked = appliedCanvasRot !== 0;
      let msg;
      if(!ok) msg = 'Could not calibrate — hold the phone upright, then tap Recentre';
      else if(locked) msg = '✓ Calibrated<br><br><b>Turn off Portrait Orientation Lock</b><br>' +
        '(swipe down from the top-right, tap the padlock icon)<br>then tap Recentre — ' +
        'the view is corrected either way, but the on-screen buttons will be sideways until you do.';
      else msg = '✓ Calibrated';
      el.innerHTML = `<div>${msg}</div>`;
      setTimeout(()=>{
        el.style.display = 'none';
        if(stereo) $('hud').classList.remove('hide');
      }, locked ? 5000 : 900);
    }
    left--;
  };
  tick();
  calTimer = setInterval(tick, 1000);
}
function exitVR(){
  stereo = false;
  clearInterval(calTimer);
  $('cal').style.display = 'none';
  if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  try{ screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); }catch(_){}
  $('ui').classList.remove('hide'); $('hud').classList.add('hide'); $('exit').style.display='none';
  $('pad').classList.remove('hide');
  mountAngle = null;            // back to a hand-held phone; re-measure next time
  applyCanvasRotation();
}
$('vr').onclick = enterVR;
$('exit').onclick = exitVR;
$('walk').onclick = e=>{ autoWalk = !autoWalk; e.target.classList.toggle('on', autoWalk); };
$('floor').onclick = e=>{
  floorIdx = (floorIdx+1) % FLOOR_HEIGHTS.length;
  rig.position.y = FLOOR_HEIGHTS[floorIdx] + EYE_HEIGHT;
  useCollisionFloor(FLOOR_HEIGHTS[floorIdx]);
  e.target.textContent = 'Floor: ' + (floorIdx===0 ? 'G' : floorIdx+'st');
};
$('recenter').onclick = recentreView;
$('tune').onclick = ()=>{ $('settings').classList.toggle('show'); };

// persist tuning across visits (best-effort; fine if storage is unavailable)
function loadSettings(){
  try { return JSON.parse(localStorage.getItem('vrTune') || '{}'); } catch(_) { return {}; }
}
function saveSettings(patch){
  try {
    const cur = loadSettings();
    localStorage.setItem('vrTune', JSON.stringify(Object.assign(cur, patch)));
  } catch(_) {}
}
const savedTune = loadSettings();

const ipdInput = $('ipd'), k1Input = $('k1'), k2Input = $('k2'), spdInput = $('spd');
const invInput = $('invPitch'), invYawInput = $('invYaw'), legacyInput = $('legacyTrack');
IPD = savedTune.ipd ?? IPD_DEFAULT; applyIPD();
distortUniforms.k1.value = savedTune.k1 ?? DISTORT_K1_DEFAULT;
distortUniforms.k2.value = savedTune.k2 ?? DISTORT_K2_DEFAULT;
let WALK_SPEED = savedTune.speed ?? WALK_SPEED_DEFAULT;
invertPitch = !!savedTune.invertPitch;
invertYaw = !!savedTune.invertYaw;
legacyTracking = !!savedTune.legacyTracking;
gazeSwap = !!savedTune.gazeSwap;
bindings = savedTune.bindings || {};
const gazeSwapInput = $('gazeSwapInput');
gazeSwapInput.checked = gazeSwap;

ipdInput.value = IPD; k1Input.value = distortUniforms.k1.value; k2Input.value = distortUniforms.k2.value;
spdInput.value = WALK_SPEED; invInput.checked = invertPitch;
invYawInput.checked = invertYaw; legacyInput.checked = legacyTracking;
showLearnPrompt();

ipdInput.oninput = ()=>{ IPD = parseFloat(ipdInput.value); applyIPD(); saveSettings({ipd:IPD}); };
k1Input.oninput  = ()=>{ distortUniforms.k1.value = parseFloat(k1Input.value); saveSettings({k1:distortUniforms.k1.value}); };
k2Input.oninput  = ()=>{ distortUniforms.k2.value = parseFloat(k2Input.value); saveSettings({k2:distortUniforms.k2.value}); };
spdInput.oninput = ()=>{ WALK_SPEED = parseFloat(spdInput.value); saveSettings({speed:WALK_SPEED}); };
invInput.onchange = ()=>{ invertPitch = invInput.checked; saveSettings({invertPitch}); };
invYawInput.onchange = ()=>{ invertYaw = invYawInput.checked; saveSettings({invertYaw}); };
legacyInput.onchange = ()=>{ legacyTracking = legacyInput.checked; saveSettings({legacyTracking}); };
gazeSwapInput.onchange = ()=>{ gazeSwap = gazeSwapInput.checked; saveSettings({gazeSwap}); };
$('diagToggle').onchange = e=>{ $('dbg').style.display = e.target.checked ? 'block' : 'none'; };

/* =========================================================================
   On-screen walk pad (flat phone view — no headset, no controller needed)
   ========================================================================= */
const padHeld = { fwd:0, back:0, left:0, right:0 };
for(const btn of document.querySelectorAll('.padbtn')){
  const act = btn.dataset.act;
  const down = e => { e.preventDefault(); padHeld[act] = 1; btn.classList.add('down'); };
  const up   = e => { e.preventDefault(); padHeld[act] = 0; btn.classList.remove('down'); };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
}
$('bindBtn').onclick = ()=>{
  if(learnIdx >= 0){ learnIdx = -1; }        // tap again to cancel
  else { bindings = {}; learnIdx = 0; }
  showLearnPrompt();
};

/* =========================================================================
   Gamepad / Bluetooth VR remote
   Buttons follow the W3C "Standard Gamepad" layout when the browser maps
   one (button 0/1/2/3 = the four face buttons, e.g. A/B/X/Y or 1/2/3/4).
   If your remote doesn't show up as a Gamepad at all, it's almost
   certainly emulating a Bluetooth keyboard instead — try the arrow keys
   (WASD/arrow movement already works either way); enable "show raw
   button/axis test" in Settings to see exactly what the browser detects
   when you press each button.
   ========================================================================= */
let padId = null;
addEventListener('gamepadconnected', e=>{
  padId = e.gamepad.id;
  $('padStatus').textContent = 'Connected: ' + padId;
});
addEventListener('gamepaddisconnected', ()=>{
  padId = null;
  $('padStatus').textContent = 'No controller detected';
});

/* triple-tap top-left corner toggles the perf HUD (debug aid, hidden by default) */
let tapCount=0, tapTimer=null;
addEventListener('pointerdown', e=>{
  if(e.clientX<60 && e.clientY<60){
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(()=>tapCount=0, 500);
    if(tapCount>=3){ $('dbg').style.display = $('dbg').style.display==='block'?'none':'block'; tapCount=0; }
  }
});

/* =========================================================================
   Resize
   ========================================================================= */
// The drawing surface is sized in the *viewer's* frame, not the browser's. If
// iOS rotation lock has kept the layout portrait while the phone is sideways
// in the headset, we draw a landscape buffer and rotate the canvas element
// itself with CSS — so all the stereo/viewport logic below stays unchanged.
function applyCanvasRotation(){
  screenAngle = readScreenAngle();     // never depend on listener ordering
  const r = appliedCanvasRot;
  const quarterTurned = Math.abs(Math.round(r / HALF_PI)) % 2 === 1;
  viewW = quarterTurned ? innerHeight : innerWidth;
  viewH = quarterTurned ? innerWidth  : innerHeight;

  const el = renderer.domElement;
  if(r === 0){
    el.style.cssText = 'display:block;touch-action:none';
  } else {
    el.style.cssText = 'display:block;touch-action:none;position:fixed;left:50%;top:50%;' +
      `width:${viewW}px;height:${viewH}px;` +
      `transform:translate(-50%,-50%) rotate(${Math.round(-r * 180 / Math.PI)}deg);`;
  }
  resize();
}

// keep the walk pad clear of the button bar, whose height depends on how many
// rows the buttons wrap onto at this width
function layoutPad(){
  const ui = $('ui');
  const h = ui.classList.contains('hide') ? 0 : ui.getBoundingClientRect().height;
  $('pad').style.bottom = Math.round(h + 12) + 'px';
}

function resize(){
  layoutPad();
  const r = appliedCanvasRot;
  const quarterTurned = Math.abs(Math.round(r / HALF_PI)) % 2 === 1;
  viewW = quarterTurned ? innerHeight : innerWidth;
  viewH = quarterTurned ? innerWidth  : innerHeight;

  renderer.setSize(viewW, viewH, r === 0);   // don't let three.js reset our CSS when rotated
  const asp = stereo ? (viewW/2)/viewH : viewW/viewH;
  [camL, camR, camMono].forEach(c=>{ c.aspect = asp; c.updateProjectionMatrix(); });
  if(stereo) rebuildRenderTargets();
}
addEventListener('resize', ()=>applyCanvasRotation());
applyCanvasRotation();

/* =========================================================================
   Movement + wall collision
   Collision: for the desired horizontal displacement, raycast from the rig
   position (at chest height) toward the movement direction, plus two side
   rays offset by the player radius to catch corner/doorway clipping. If a
   wall is hit inside (moveDist + radius), the movement is (a) clamped so we
   never cross the radius buffer, and (b) slid along the wall tangent so
   grazing a wall doesn't just stop you dead — this is what makes doorway
   openings feel navigable instead of catching on the frame.
   ========================================================================= */
const raycaster = new THREE.Raycaster();
const _dir = new THREE.Vector3(), _origin = new THREE.Vector3();
const CHEST_Y_OFFSET = -0.5; // relative to eye height, roughly chest/shoulder level for wall checks

/* -------------------------------------------------------------------------
   Collision geometry.
   Raycasting the whole house (190k triangles) every frame is what made
   movement crawl — three.js has no acceleration structure, so each ray tests
   every triangle. Measured on desktop: 60fps standing still, 30fps the moment
   you walk; on a phone in stereo it is far worse.

   Since eye height is fixed per floor and we only move horizontally, almost
   none of that geometry can ever be hit. So build a slim collision mesh per
   floor, once, keeping only triangles that
     (a) overlap the band of space the body actually occupies on that floor,
     (b) are wall-like rather than floor/ceiling-like (a horizontal surface
         can never block horizontal movement).
   ------------------------------------------------------------------------- */
const CELL = 0.5;                  // grid cell size in metres
const collisionCache = new Map();
let colTris = null;                // flat Float32Array, 9 floats per triangle
let colGrid = null;                // Map<cellKey, triangleIndex[]>
let colStamp = null;               // dedupe scratch
let colStampTick = 0;
let colCount = 0;

const cellKey = (ix, iz) => ix * 1000003 + iz;

function buildCollision(floorY){
  if(collisionCache.has(floorY)) return collisionCache.get(floorY);
  const lo = floorY + 0.15, hi = floorY + 1.95;
  const out = [];
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  const ab = new THREE.Vector3(), ac = new THREE.Vector3(), nrm = new THREE.Vector3();
  let total = 0;

  for(const m of collidables){
    const p = m.geometry.attributes.position;
    const idx = m.geometry.index;
    const count = idx ? idx.count : p.count;
    for(let i = 0; i < count; i += 3){
      const i0 = idx ? idx.getX(i)   : i;
      const i1 = idx ? idx.getX(i+1) : i+1;
      const i2 = idx ? idx.getX(i+2) : i+2;
      total++;
      const y0 = p.getY(i0), y1 = p.getY(i1), y2 = p.getY(i2);
      if(Math.max(y0,y1,y2) < lo || Math.min(y0,y1,y2) > hi) continue;   // out of reach
      a.fromBufferAttribute(p, i0); b.fromBufferAttribute(p, i1); c.fromBufferAttribute(p, i2);
      ab.subVectors(b, a); ac.subVectors(c, a); nrm.crossVectors(ab, ac);
      const len = nrm.length();
      if(len < 1e-12) continue;
      if(Math.abs(nrm.y / len) > 0.75) continue;                         // floor/ceiling-like
      out.push(a.x,a.y,a.z, b.x,b.y,b.z, c.x,c.y,c.z);
    }
  }

  // Bucket every kept triangle into the XZ cells its footprint covers. A step
  // is ~2cm and the longest ray is ~0.4m, so a query only ever touches a
  // couple of cells — a few hundred triangles instead of tens of thousands.
  const tris = new Float32Array(out);
  const grid = new Map();
  const n = tris.length / 9;
  for(let t = 0; t < n; t++){
    const o = t * 9;
    const minX = Math.min(tris[o], tris[o+3], tris[o+6]);
    const maxX = Math.max(tris[o], tris[o+3], tris[o+6]);
    const minZ = Math.min(tris[o+2], tris[o+5], tris[o+8]);
    const maxZ = Math.max(tris[o+2], tris[o+5], tris[o+8]);
    for(let ix = Math.floor(minX/CELL); ix <= Math.floor(maxX/CELL); ix++){
      for(let iz = Math.floor(minZ/CELL); iz <= Math.floor(maxZ/CELL); iz++){
        const k = cellKey(ix, iz);
        let arr = grid.get(k);
        if(!arr) grid.set(k, arr = []);
        arr.push(t);
      }
    }
  }

  const result = { tris, grid, count: n, total, stamp: new Uint32Array(n) };
  collisionCache.set(floorY, result);
  console.log(`collision floor y=${floorY}: ${n} of ${total} triangles, ${grid.size} grid cells`);
  return result;
}

function useCollisionFloor(floorY){
  const built = buildCollision(floorY);
  colTris = built.tris; colGrid = built.grid;
  colStamp = built.stamp; colCount = built.count;
  return built;
}

/* Cast a ray against only the triangles near it. Returns distance + normal. */
const _ray = new THREE.Ray();
const _va = new THREE.Vector3(), _vb = new THREE.Vector3(), _vc = new THREE.Vector3();
const _pt = new THREE.Vector3(), _e1 = new THREE.Vector3(), _e2 = new THREE.Vector3();
const _candidates = [];

function castCollision(origin, dir, maxDist, outNormal){
  if(!colTris || colCount === 0) return Infinity;
  _ray.origin.copy(origin); _ray.direction.copy(dir);

  // cells covered by the ray's XZ footprint, padded a little
  const ex = origin.x + dir.x * maxDist, ez = origin.z + dir.z * maxDist;
  const pad = 0.05;
  const ix0 = Math.floor((Math.min(origin.x, ex) - pad) / CELL);
  const ix1 = Math.floor((Math.max(origin.x, ex) + pad) / CELL);
  const iz0 = Math.floor((Math.min(origin.z, ez) - pad) / CELL);
  const iz1 = Math.floor((Math.max(origin.z, ez) + pad) / CELL);

  const tick = ++colStampTick;
  _candidates.length = 0;
  for(let ix = ix0; ix <= ix1; ix++){
    for(let iz = iz0; iz <= iz1; iz++){
      const arr = colGrid.get(cellKey(ix, iz));
      if(!arr) continue;
      for(let i = 0; i < arr.length; i++){
        const t = arr[i];
        if(colStamp[t] === tick) continue;     // already considered
        colStamp[t] = tick;
        _candidates.push(t);
      }
    }
  }

  let best = Infinity;
  for(let i = 0; i < _candidates.length; i++){
    const o = _candidates[i] * 9;
    _va.set(colTris[o],   colTris[o+1], colTris[o+2]);
    _vb.set(colTris[o+3], colTris[o+4], colTris[o+5]);
    _vc.set(colTris[o+6], colTris[o+7], colTris[o+8]);
    if(_ray.intersectTriangle(_va, _vb, _vc, false, _pt)){
      const d = origin.distanceTo(_pt);
      if(d < best && d <= maxDist){
        best = d;
        if(outNormal){
          _e1.subVectors(_vb, _va); _e2.subVectors(_vc, _va);
          outNormal.crossVectors(_e1, _e2).normalize();
        }
      }
    }
  }
  return best;
}

const _moveDir = new THREE.Vector3(), _lateral = new THREE.Vector3(), _rayOrigin = new THREE.Vector3();
const _hitN = new THREE.Vector3(), _bestN = new THREE.Vector3();
const _remaining = new THREE.Vector3(), _slid = new THREE.Vector3(), _slidDir = new THREE.Vector3();

function tryMove(deltaXZ){
  const dist = deltaXZ.length();
  if(dist < 1e-6 || !colTris || colCount === 0){ rig.position.add(deltaXZ); return; }
  _moveDir.copy(deltaXZ).normalize();
  _origin.copy(rig.position); _origin.y += CHEST_Y_OFFSET;

  // the movement direction plus two shoulder-width offsets (approximates a capsule)
  _lateral.set(-_moveDir.z, 0, _moveDir.x).multiplyScalar(PLAYER_RADIUS);
  const maxDist = dist + PLAYER_RADIUS + 0.05;

  let allowed = dist;
  let haveNormal = false;
  for(let k = -1; k <= 1; k++){
    _rayOrigin.copy(_origin).addScaledVector(_lateral, k);
    const d = castCollision(_rayOrigin, _moveDir, maxDist, _hitN);
    if(d < Infinity){
      const free = Math.max(0, d - PLAYER_RADIUS);
      if(free < allowed){ allowed = free; _bestN.copy(_hitN); haveNormal = true; }
    }
  }

  if(allowed >= dist - 1e-4){
    rig.position.add(deltaXZ);
    return;
  }

  rig.position.addScaledVector(_moveDir, allowed);   // move up to the wall

  // slide: drop the component of the remaining motion that points into the wall
  if(haveNormal){
    _remaining.copy(deltaXZ).addScaledVector(_moveDir, -allowed);
    _bestN.y = 0;
    if(_bestN.lengthSq() > 1e-6){
      _bestN.normalize();
      _slid.copy(_remaining).addScaledVector(_bestN, -_remaining.dot(_bestN));
      if(_slid.lengthSq() > 1e-8){
        const slidDist = _slid.length();
        _slidDir.copy(_slid).normalize();
        const d2 = castCollision(_origin, _slidDir, slidDist + PLAYER_RADIUS + 0.05, null);
        const freeSlide = d2 < Infinity ? Math.max(0, d2 - PLAYER_RADIUS) : slidDist;
        rig.position.addScaledVector(_slidDir, Math.min(freeSlide, slidDist));
      }
    }
  }
}

const _fwd = new THREE.Vector3(), _flatFwd = new THREE.Vector3(), clock = new THREE.Clock();
function currentPitchRad(){
  _fwd.set(0,0,-1).applyQuaternion(head.quaternion);
  return Math.asin(THREE.MathUtils.clamp(_fwd.y, -1, 1));
}

function updateMovement(dt){
  // NB: head is a plain Object3D, and Object3D.getWorldDirection() returns the
  // object's +Z axis — which points BEHIND the viewer. (Only Camera overrides
  // it to return the viewing direction.) Using it here sent you backwards
  // whenever you looked down, and mirrored strafing. Take -Z explicitly, which
  // is also exactly what currentPitchRad() uses, so the two always agree.
  _flatFwd.set(0, 0, -1).applyQuaternion(head.quaternion);
  _flatFwd.y = 0;
  if(_flatFwd.lengthSq() < 1e-8) return;
  _flatFwd.normalize();

  let v = 0;

  if(autoWalk){
    // Looking down walks you TOWARDS whatever you were just looking at.
    // Looking up does NOT walk you backwards — it just looks up. Use the
    // on-screen pad, a bound remote button or S/down-arrow to go back.
    const pitchDeg = THREE.MathUtils.radToDeg(currentPitchRad()) * (gazeSwap ? -1 : 1);
    if(pitchDeg < -GAZE_FWD_THRESH_DEG) v = 1;
  }

  // desktop keyboard (and any remote that presents as a HID keyboard)
  if(keys.KeyW || keys.ArrowUp)   v = 1;
  if(keys.KeyS || keys.ArrowDown) v = -1;
  let strafe = 0;
  if(keys.KeyD || keys.ArrowRight) strafe = 1;
  if(keys.KeyA || keys.ArrowLeft)  strafe = -1;

  // on-screen walk pad
  if(padHeld.fwd)   v = 1;
  if(padHeld.back)  v = -1;
  if(padHeld.left)  strafe = -1;
  if(padHeld.right) strafe = 1;

  const pads = navigator.getGamepads ? navigator.getGamepads() : [];

  // gamepad (Bluetooth VR remote / controller), default mapping
  for(const p of pads){
    if(!p) continue;
    // analog stick, if the browser reports one
    if(p.axes.length >= 2){
      if(Math.abs(p.axes[1]) > 0.15) v = -p.axes[1];
      if(Math.abs(p.axes[0]) > 0.15) strafe = p.axes[0];
    }
    // face buttons as a digital fallback — Standard Gamepad: 0=A/bottom,
    // 1=B/right, 2=X/left, 3=Y/top. D-pad is 12-15.
    if(p.buttons[0]?.pressed) v = 1;
    if(p.buttons[1]?.pressed) v = -1;
    if(p.buttons[2]?.pressed) strafe = -1;
    if(p.buttons[3]?.pressed) strafe = 1;
    if(p.buttons[12]?.pressed) v = 1;
    if(p.buttons[13]?.pressed) v = -1;
    if(p.buttons[14]?.pressed) strafe = -1;
    if(p.buttons[15]?.pressed) strafe = 1;
  }

  // learned bindings win over everything above
  const active = b => {
    if(!b) return false;
    if(b.t === 'k') return !!keys[b.c];
    if(b.t === 'm') return !!mouseHeld[b.b];
    for(const p of pads){ if(p && p.buttons[b.i] && p.buttons[b.i].pressed) return true; }
    return false;
  };
  if(active(bindings.forward)) v = 1;
  if(active(bindings.back))    v = -1;
  if(active(bindings.left))    strafe = -1;
  if(active(bindings.right))   strafe = 1;

  if(v === 0 && strafe === 0) return;

  const right = new THREE.Vector3(-_flatFwd.z, 0, _flatFwd.x);
  const delta = new THREE.Vector3()
    .addScaledVector(_flatFwd, v * WALK_SPEED * dt)
    .addScaledVector(right, strafe * WALK_SPEED * dt);
  tryMove(delta);
}

/* =========================================================================
   Render loop
   ========================================================================= */
renderer.setAnimationLoop(()=>{
  const dt = Math.min(clock.getDelta(), 0.05);

  settleCanvasRotation();
  updateHeadOrientation(dt);

  if(modelLoaded) updateMovement(dt);

  const w = viewW, h = viewH;

  if(stereo && rtL && rtR){
    renderer.setRenderTarget(rtL); renderer.clear(); renderer.render(scene, camL);
    renderer.setRenderTarget(rtR); renderer.clear(); renderer.render(scene, camR);
    renderer.setRenderTarget(null);
    renderer.clear();

    distortUniforms.tex.value = rtL.texture;
    renderer.setViewport(0, 0, w/2, h);
    renderer.render(distortScene, distortCam);

    distortUniforms.tex.value = rtR.texture;
    renderer.setViewport(w/2, 0, w/2, h);
    renderer.render(distortScene, distortCam);
  } else {
    renderer.setRenderTarget(null);
    renderer.setViewport(0,0,w,h);
    renderer.clear();
    renderer.render(scene, camMono);
  }

  const dbg = document.getElementById('dbg');
  if(dbg.style.display === 'block'){
    const R = THREE.MathUtils.radToDeg;
    const pitchDeg = Math.round(R(currentPitchRad()));
    const track = !gyroOn ? 'touch' : (legacyTracking ? 'legacy' : (gyroAvailable ? 'fusion' : 'gravity-only(no gyro!)'));
    _euler.setFromQuaternion(head.quaternion, 'YXZ');
    const headingDeg = R(headingOf(head.quaternion));
    dbg.textContent =
      `calls:${renderer.info.render.calls} tris:${renderer.info.render.triangles} fps~${Math.round(1/Math.max(dt,1e-4))}\n` +
      `track:${track}\n` +
      `view  pitch:${pitchDeg}° yaw:${headingDeg.toFixed(0)}° roll:${R(_euler.z).toFixed(0)}°\n` +
      `sensor beta:${lastBetaDeg.toFixed(0)} gamma:${lastGammaDeg.toFixed(0)} alpha:${lastHeadingDeg.toFixed(0)}\n` +
      `grav  ${gravDev.x.toFixed(2)},${gravDev.y.toFixed(2)},${gravDev.z.toFixed(2)}\n` +
      `mount:${mountAngle===null?'uncal':R(mountAngle).toFixed(0)+'°'} scr:${screenAngle}° ` +
      `canvasRot:${R(appliedCanvasRot).toFixed(0)}°/${R(desiredCanvasRotation()).toFixed(0)}°\n` +
      `view ${viewW}x${viewH} win ${innerWidth}x${innerHeight} rej:${glitchesRejected}\n` +
      `pos ${rig.position.x.toFixed(2)},${rig.position.y.toFixed(2)},${rig.position.z.toFixed(2)} ` +
      `col:${colCount}\n` +
      `key:${lastKeyLabel.slice(0,34)}`;
  }

  // live controller / remote diagnostics (only while the Tune panel is open)
  if($('settings').classList.contains('show')){
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    let lines = [];
    for(const p of pads){
      if(!p) continue;
      const axes = p.axes.map(a=>a.toFixed(2)).join(', ');
      const btns = p.buttons.map((b,i)=> b.pressed ? i : null).filter(x=>x!==null);
      lines.push(`${p.id}\naxes [${axes}]\npressed [${btns.join(',')}]`);
      if(learnIdx >= 0 && btns.length) captureBinding({ t:'p', i:btns[0] });
    }
    $('padStatus').textContent = lines.length
      ? lines.join('\n\n')
      : 'No gamepad detected.\nIf your remote is paired but nothing shows here or\nin "last key", it is sending system media keys that\niOS never passes to a web page — see the README.';
    $('keyLog').textContent = 'last key: ' + lastKeyLabel;
  }
});
</script>
